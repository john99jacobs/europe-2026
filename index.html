<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005F8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Europe 2026">
  <title>Europe 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <span class="site-title">Europe 2026</span>
        <nav class="tab-nav">
          <a href="#today" class="tab-link" id="tab-today">Today</a>
          <a href="#itinerary" class="tab-link" id="tab-itinerary">Itinerary</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      <section id="view-today" class="view"><div class="loading-state">Loading…</div></section>
      <section id="view-itinerary" class="view hidden"></section>
    </div>
  </main>

  <script src="js/weather.js"></script>
  <script src="js/flights.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/app.js"></script>
  <script src="js/assistant.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <button id="assistant-fab" class="assistant-fab" aria-label="Ask trip assistant" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <div id="assistant-panel" class="assistant-panel" role="dialog" aria-modal="true" aria-label="Trip Assistant">
    <div class="assistant-header">
      <span class="assistant-title">Trip Assistant</span>
      <button id="assistant-close" class="assistant-close" aria-label="Close assistant">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="assistant-messages" class="assistant-messages"></div>
    <div class="assistant-input-row">
      <textarea id="assistant-input" class="assistant-input" placeholder="Ask about the trip…" rows="1" autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
      <button id="assistant-send" class="assistant-send" aria-label="Send message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</body>
</html>
